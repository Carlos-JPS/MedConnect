global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8080

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:9090

  - job_name: booking-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - booking-service:9090

  - job_name: availability-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - availability-service:9090

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - payment-service:9090
