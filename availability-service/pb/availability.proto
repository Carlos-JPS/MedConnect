syntax = "proto3";

package availability;

option go_package = "github.com/Carlos-JPS/medconnect/availability-service/pb";

// --- Entidades ---

message Slot {
  string slot_id = 1;
  string doctor_id = 2;
  string specialty = 3;
  string start_time = 4;
  string end_time = 5;
  string status = 6;
}

// --- GetAvailableSlots ---

message GetAvailableSlotsRequest {
  string specialty = 1;
  string from_date = 2;
  string to_date = 3;
  string doctor_id = 4;
}

message GetAvailableSlotsResponse {
  repeated Slot slots = 1;
}

// --- HoldSlot ---

message HoldSlotRequest {
  string slot_id = 1;
  string booking_id = 2;
  string held_until = 3;
}

message HoldSlotResponse {
  string slot_id = 1;
  string status = 2;
  string held_until = 3;
  string booking_id = 4;
}

// --- ConfirmSlotBooking ---

message ConfirmSlotBookingRequest {
  string slot_id = 1;
  string booking_id = 2;
}

message ConfirmSlotBookingResponse {
  string slot_id = 1;
  string status = 2;
  string booking_id = 3;
}

// --- ReleaseHeldSlot ---

message ReleaseHeldSlotRequest {
  string slot_id = 1;
  string booking_id = 2;
}

message ReleaseHeldSlotResponse {
  string slot_id = 1;
  string status = 2;
}

// --- GetDoctorAgenda ---

message GetDoctorAgendaRequest {
  string doctor_id = 1;
  string from_date = 2;
  string to_date = 3;
}

message GetDoctorAgendaResponse {
  string doctor_id = 1;
  repeated Slot slots = 2;
}

// --- Servicio ---

service AvailabilityService {
  // Obtiene espacios disponibles según especialidad y rango de fechas
  rpc GetAvailableSlots (GetAvailableSlotsRequest) returns (GetAvailableSlotsResponse);
  
  // Bloquea un espacio temporalmente mientras se procesa el pago
  rpc HoldSlot (HoldSlotRequest) returns (HoldSlotResponse);
  
  // Confirma definitivamente un bloqueo previo (post-pago)
  rpc ConfirmSlotBooking (ConfirmSlotBookingRequest) returns (ConfirmSlotBookingResponse);
  
  // Libera un bloqueo temporal (si el pago falla o expira)
  rpc ReleaseHeldSlot (ReleaseHeldSlotRequest) returns (ReleaseHeldSlotResponse);
  
  // Obtiene toda la agenda de un médico específico
  rpc GetDoctorAgenda (GetDoctorAgendaRequest) returns (GetDoctorAgendaResponse);
}
