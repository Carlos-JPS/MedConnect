syntax = "proto3";

package payment;

option go_package = "github.com/sllanoscaro/payment-service/pb";

// ─ Mensajes ─────────────────────────────────────────────

message Payment {
  string payment_id = 1;
  string booking_id = 2;
  string user_id = 3;
  double amount = 4;
  string currency = 5;
  string status = 6;
  string created_at = 7;
}

message Refund {
  string refund_id = 1;
  string payment_id = 2;
  double amount = 3;
  string reason = 4;
  string status = 5;
  string created_at = 6;
}

// ─ Requests / Responses ─────────────────────────────────

message CreatePaymentRequest {
  string booking_id = 1;
  string user_id = 2;
  double amount = 3;
  string currency = 4;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message ProcessPaymentRequest {
  string payment_id = 1;
  string payment_method_id = 2;
}

message ProcessPaymentResponse {
  string payment_id = 1;
  string transaction_id = 2;
  string status = 3;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message GetPaymentsByUserRequest {
  string user_id = 1;
}

message GetPaymentsByUserResponse {
  repeated Payment payments = 1;
}

message GetPaymentByBookingRequest {
  string booking_id = 1;
}

message GetPaymentByBookingResponse {
  Payment payment = 1;
}

message RefundPaymentRequest {
  string payment_id = 1;
  double amount = 2;
  string reason = 3;
}

message RefundPaymentResponse {
  Refund refund = 1;
}

// ─ Servicio ─────────────────────────────────────────────

service PaymentService {
  rpc CreatePayment      (CreatePaymentRequest)      returns (CreatePaymentResponse);
  rpc ProcessPayment     (ProcessPaymentRequest)     returns (ProcessPaymentResponse);
  rpc GetPayment         (GetPaymentRequest)         returns (GetPaymentResponse);
  rpc GetPaymentsByUser  (GetPaymentsByUserRequest)  returns (GetPaymentsByUserResponse);
  rpc GetPaymentByBooking(GetPaymentByBookingRequest)returns (GetPaymentByBookingResponse);
  rpc RefundPayment      (RefundPaymentRequest)      returns (RefundPaymentResponse);
}