services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - medconnect_internal

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - medconnect_internal

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - medconnect_internal

  alloy:
    image: grafana/alloy:v1.7.4
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - alloy_data:/var/lib/alloy
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - medconnect_internal

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      API_GATEWAY_HOST: ${API_GATEWAY_HOST:-0.0.0.0}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-8080}
      API_GATEWAY_REQUEST_TIMEOUT: ${API_GATEWAY_REQUEST_TIMEOUT:-5s}
      BOOKING_SERVICE_TARGET: ${BOOKING_SERVICE_TARGET:-booking-service:50051}
      PAYMENT_SERVICE_TARGET: ${PAYMENT_SERVICE_TARGET:-payment-service:50051}
      AVAILABILITY_SERVICE_TARGET: ${AVAILABILITY_SERVICE_TARGET:-availability-service:50051}
      AUTH_SERVICE_TARGET: ${AUTH_SERVICE_TARGET:-auth-service:50051}
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    depends_on:
      - booking-service
      - payment-service
      - availability-service
      - auth-service
    networks:
      - medconnect_internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api-gateway
    networks:
      - medconnect_internal

  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - medconnect_internal

  kafka-init:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic medconnect.booking.events.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic medconnect.booking.events.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=1209600000
    networks:
      - medconnect_internal

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      BOOKING_SERVICE_HOST: ${BOOKING_SERVICE_HOST:-0.0.0.0}
      BOOKING_SERVICE_PORT: ${BOOKING_SERVICE_PORT:-50051}
      BOOKING_DB_DSN: ${BOOKING_DB_DSN:-postgres://booking:booking_password@booking_db:5432/booking_db?sslmode=disable}
      AVAILABILITY_SERVICE_TARGET: ${AVAILABILITY_SERVICE_TARGET:-availability-service:50051}
      PAYMENT_SERVICE_TARGET: ${PAYMENT_SERVICE_TARGET:-payment-service:50051}
      BOOKING_EXTERNAL_CALL_TIMEOUT: ${BOOKING_EXTERNAL_CALL_TIMEOUT:-3s}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-medconnect.booking.events.v1}
      OUTBOX_DISPATCHER_ENABLED: ${OUTBOX_DISPATCHER_ENABLED:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      OUTBOX_RETRY_INITIAL_DELAY: ${OUTBOX_RETRY_INITIAL_DELAY:-1s}
      OUTBOX_RETRY_MAX_DELAY: ${OUTBOX_RETRY_MAX_DELAY:-30s}
      METRICS_PORT: ${BOOKING_METRICS_PORT:-9090}
    expose:
      - "${BOOKING_SERVICE_PORT:-50051}"
      - "${BOOKING_METRICS_PORT:-9090}"
    depends_on:
      booking_db:
        condition: service_healthy
    networks:
      - medconnect_internal

  booking_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_db}
      POSTGRES_USER: ${BOOKING_DB_USER:-booking}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_password}
    volumes:
      - booking_db_data:/var/lib/postgresql/data
      - ./booking-service/migrations/000001_create_booking_tables.up.sql:/docker-entrypoint-initdb.d/001_create_booking_tables.sql:ro
      - ./booking-service/migrations/000002_allow_rebooking_cancelled_slots.up.sql:/docker-entrypoint-initdb.d/002_allow_rebooking_cancelled_slots.sql:ro
      - ./booking-service/migrations/000003_create_outbox_events.up.sql:/docker-entrypoint-initdb.d/003_create_outbox_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-booking} -d ${BOOKING_DB_NAME:-booking_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medconnect_internal

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      NOTIFICATION_DB_DSN: ${NOTIFICATION_DB_DSN:-postgres://notification:notification_password@notification_db:5432/notification_db?sslmode=disable}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-medconnect.booking.events.v1}
      BOOKING_EVENTS_DLQ_TOPIC: ${BOOKING_EVENTS_DLQ_TOPIC:-medconnect.booking.events.dlq.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-medconnect-notification-service-v1}
      NOTIFICATION_RETRY_LIMIT: ${NOTIFICATION_RETRY_LIMIT:-3}
      NOTIFICATION_LOG_ENABLED: ${NOTIFICATION_LOG_ENABLED:-true}
    depends_on:
      notification_db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - medconnect_internal

  notification_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_password}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
      - ./notification-service/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-notification} -d ${NOTIFICATION_DB_NAME:-notification_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medconnect_internal

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: payments-db
      DB_PORT: 5432
      DB_USER: ${PAYMENTS_DB_USER:-postgres}
      DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-postgres}
      DB_NAME: ${PAYMENTS_DB_NAME:-payments_db}
      GRPC_PORT: ${PAYMENT_SERVICE_PORT:-50051}
      METRICS_PORT: ${PAYMENT_METRICS_PORT:-9090}
    expose:
      - "${PAYMENT_SERVICE_PORT:-50051}"
      - "${PAYMENT_METRICS_PORT:-9090}"
    depends_on:
      payments-db:
        condition: service_healthy
    networks:
      - medconnect_internal

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PAYMENTS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PAYMENTS_DB_NAME:-payments_db}
    volumes:
      - payments_db_data:/var/lib/postgresql/data
      - ./payment-service/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_DB_USER:-postgres} -d ${PAYMENTS_DB_NAME:-payments_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medconnect_internal

  availability-service:
    build:
      context: ./availability-service
      dockerfile: Dockerfile
    container_name: availability-service
    environment:
      DB_HOST: availability-db-shard-0
      DB_PORT: 5432
      DB_USER: ${AVAILABILITY_DB_USER:-postgres}
      DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-postgres}
      DB_NAME: ${AVAILABILITY_DB_NAME:-availability_db}
      GRPC_PORT: ${AVAILABILITY_SERVICE_PORT:-50051}
      AVAILABILITY_SHARDING_ENABLED: ${AVAILABILITY_SHARDING_ENABLED:-true}
      AVAILABILITY_PARTITION_COUNT: ${AVAILABILITY_PARTITION_COUNT:-16}
      AVAILABILITY_SHARDS: ${AVAILABILITY_SHARDS:-shard0,shard1}
      AVAILABILITY_PARTITION_MAP: ${AVAILABILITY_PARTITION_MAP:-0:shard0,1:shard0,2:shard0,3:shard0,4:shard0,5:shard0,6:shard0,7:shard0,8:shard1,9:shard1,10:shard1,11:shard1,12:shard1,13:shard1,14:shard1,15:shard1}
      AVAILABILITY_SHARD0_DSN: ${AVAILABILITY_SHARD0_DSN:-postgres://postgres:postgres@availability-db-shard-0:5432/availability_db?sslmode=disable}
      AVAILABILITY_SHARD1_DSN: ${AVAILABILITY_SHARD1_DSN:-postgres://postgres:postgres@availability-db-shard-1:5432/availability_db?sslmode=disable}
      METRICS_PORT: ${AVAILABILITY_METRICS_PORT:-9090}
    expose:
      - "${AVAILABILITY_SERVICE_PORT:-50051}"
      - "${AVAILABILITY_METRICS_PORT:-9090}"
    depends_on:
      availability-db-shard-0:
        condition: service_healthy
      availability-db-shard-1:
        condition: service_healthy
    networks:
      - medconnect_internal

  availability-db-shard-0:
    image: postgres:15
    container_name: availability-db-shard-0
    environment:
      POSTGRES_USER: ${AVAILABILITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AVAILABILITY_DB_NAME:-availability_db}
    volumes:
      - availability-db-shard-0-data:/var/lib/postgresql/data
      - ./availability-service/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./availability-service/db/seed_shard0.sql:/docker-entrypoint-initdb.d/002_seed_shard0.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AVAILABILITY_DB_USER:-postgres} -d ${AVAILABILITY_DB_NAME:-availability_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medconnect_internal

  availability-db-shard-1:
    image: postgres:15
    container_name: availability-db-shard-1
    environment:
      POSTGRES_USER: ${AVAILABILITY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AVAILABILITY_DB_NAME:-availability_db}
    volumes:
      - availability-db-shard-1-data:/var/lib/postgresql/data
      - ./availability-service/db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./availability-service/db/seed_shard1.sql:/docker-entrypoint-initdb.d/002_seed_shard1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AVAILABILITY_DB_USER:-postgres} -d ${AVAILABILITY_DB_NAME:-availability_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medconnect_internal

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_HOST: ${AUTH_SERVICE_HOST:-0.0.0.0}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-50051}
      AUTH_DB_DSN: ${AUTH_DB_DSN:-postgres://auth:auth_password@auth_db:5432/auth_db?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-medconnect-jwt-secret-change-me}
      METRICS_PORT: ${AUTH_METRICS_PORT:-9090}
    expose:
      - "${AUTH_SERVICE_PORT:-50051}"
      - "${AUTH_METRICS_PORT:-9090}"
    depends_on:
      auth_db:
        condition: service_healthy
    networks:
      - medconnect_internal

  auth_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./auth-service/migrations/000001_create_users_table.up.sql:/docker-entrypoint-initdb.d/001_create_users_table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medconnect_internal

volumes:
  availability-db-shard-0-data:
  availability-db-shard-1-data:
  booking_db_data:
  alloy_data:
  grafana_data:
  loki_data:
  prometheus_data:
  payments_db_data:
  auth_db_data:
  kafka_data:
  notification_db_data:

networks:
  medconnect_internal:
    driver: bridge
